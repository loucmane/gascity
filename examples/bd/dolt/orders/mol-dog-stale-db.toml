# Stale-database cleanup. The threshold decision is deterministic, so the
# controller runs it directly without a dog session, work bead, or model.
[order]
description = "Detect and clean stale Dolt databases and orphan dolt sql-server processes"
exec = "$PACK_DIR/assets/scripts/mol-dog-stale-db.sh"
trigger = "cron"
schedule = "0 */4 * * *"
timeout = "15m"
