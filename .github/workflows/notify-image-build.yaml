# Notify gasworks-control-plane to rebuild the gc-runtime image when Go source
# changes.
#
# gascity provides the gc binary embedded in runtime images.
# When source code changes, images need rebuilding.
#
# Upstream dispatch requires GASCITY_HOSTED_TOKEN — a token with contents:write
# on gascity/gasworks-control-plane. Forks and upstream checkouts without the
# optional integration token report an explicit no-op instead of failing main.

name: Notify Image Rebuilds

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - "contrib/**"
      - ".github/workflows/notify-image-build.yaml"
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Classify runtime image notification
        id: dispatch_gate
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          HOSTED_TOKEN: ${{ secrets.GASCITY_HOSTED_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$SOURCE_REPOSITORY" != "gascity/gascity" ]]; then
            decision=skip
            reason=fork
          elif [[ -z "$HOSTED_TOKEN" ]]; then
            decision=skip
            reason=missing-token
          else
            decision=dispatch
            reason=configured
          fi

          printf 'decision=%s\nreason=%s\n' "$decision" "$reason" >> "$GITHUB_OUTPUT"
          printf 'runtime-image-notify: %s (%s)\n' "$decision" "$reason"
          printf '### Runtime image notification\n\n- Decision: `%s`\n- Reason: `%s`\n' \
            "$decision" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger runtime image rebuild
        if: steps.dispatch_gate.outputs.decision == 'dispatch'
        env:
          GH_TOKEN: ${{ secrets.GASCITY_HOSTED_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/gascity/gasworks-control-plane/dispatches \
            -f event_type=runtime-dep-updated
